<!DOCTYPE html>

<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">

        <link rel="stylesheet" href="Styles/textEncript.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <title>RUmana- AluraLat- OracleOne Text Encription model</title>
       
    </head>

    <body>
       
        <header class="encabezado">
            <img class="logo--alura" src="assets/OIP.jpeg" alt="Logo Alura">
            <img class="logo--encrip" src="assets/encriptadorLogo5A.png" alt="LogoEncriptador">

        </header>
      
        <main class="principal">
            <h1>Alura - OracleOne Text Encript model</h1> 
                
            <section class="textos">

                <textarea class="texto-ingreso"  cols="30" rows="10" placeholder="Ingrese el texto aquí" ></textarea>
                 
                <div class="botones">
                    <button class="boton-encriptar"  onclick="btnEncriptar()" >Encriptar</button>
                    <button class="boton-copiar" onclick="btnCopiar()">Copiar</button>
                    <button class="boton-desencriptar" onclick="btnDesencriptar()">Desencriptar</button>
                </div>

                <textarea class="texto-encriptado"  cols="30" rows="10" placeholder="..."></textarea>
            </section>
            
            <aside class="sinMensaje">
                <h6 class="headH6">Ningún mensaje fue encontrado</h6>
                <p class="informacion1">ingresa el  texto que desees encriptar  o desencriptar</p>
            </aside>

            <p class="informacion">Solo letras minúsculas y sin acentos</p>
        </main>

        <footer class="piepagina">
            <div class="presentacion__enlaces">
                <h3 class="presentacion__enlaces__subtitulo">Accede a mis redes</h3>
                <a class="presentacion__enlaces__link" href="https://github.com/">
                    <img src="./assets/github.png" alt="GitHub logo">
                    Github
                </a>
                <a class="presentacion__enlaces__link" href="https://linkedin.com/in/">
                    <img src="./assets/linkedin.png" alt="linkedin logo">
                    Linkedin
                </a>
                <a class="presentacion__enlaces__link" href="https://twitch.tv/">
                    <img src="./assets/twitch.png" alt="Twitch logo">
                    Twitch
                </a>
                <p class="informacion2"> Modelo presentado por Ricardo Umaña Guzmán, para el curso de Alura-Latam y OracleOne</p>
            </div>
        </footer>

        <script src="textEncript.js"></script>
    </body>
</html>
